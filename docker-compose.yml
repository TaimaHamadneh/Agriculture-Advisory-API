services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: agri_user
      POSTGRES_PASSWORD: agri_pass
      POSTGRES_DB: agri_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri_user -d agri_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://agri_user:agri_pass@db:5432/agri_db
      API_KEY: ${API_KEY} 
    volumes:
      - ./app:/app/app
      - ./crop_optimal_conditions.csv:/app/crop_optimal_conditions.csv

volumes:
  postgres_data: